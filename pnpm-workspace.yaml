# pnpm configuration
#
# allowBuilds: approve the core-js postinstall scripts. pnpm 11 requires
#   explicit build-script approval; without it the build fails with
#   ERR_PNPM_IGNORED_BUILDS.
#
# overrides:
#  - webpackbar 6.0.1 + webpack 5.104.1: webpack 5.109 tightened the
#    ProgressPlugin options schema and rejects the name/color/reporters
#    fields webpackbar 6.0.1 passes, breaking the build. Pinned to 5.104.1
#    (the last 5.x with the lenient schema) until webpackbar ships a fix.
allowBuilds:
  core-js: true
  core-js-pure: true
overrides:
  webpackbar: 6.0.1
  webpack: 5.104.1
